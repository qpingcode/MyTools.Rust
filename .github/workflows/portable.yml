name: Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build and package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Upload portable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: MyTools-windows-x64-portable
          path: |
            dist/MyTools-windows-x64-portable.zip
            dist/MyTools-windows-x64-portable.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
