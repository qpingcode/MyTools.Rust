name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Build Windows portable package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Upload portable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: MyTools-windows-x64-portable
          path: |
            dist/MyTools-windows-x64-portable.zip
            dist/MyTools-windows-x64-portable.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
