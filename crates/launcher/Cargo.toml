[package]
name = "mytools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
slint.workspace = true
mytools-core.workspace = true
mytools-plugin-api.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-channel = "2"
arboard = { version = "3", default-features = false }
global-hotkey = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build.workspace = true
winresource = { version = "0.1", default-features = false }
